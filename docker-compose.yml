services:

  postgres:
    image: postgres:16-alpine
    container_name: fitback-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitback-redis
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres-data:
