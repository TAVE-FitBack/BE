services:

  app:
    image: 7iniyo/fitback:latest
    container_name: fitback-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://fitback-postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: fitback-redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: fitback-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fitback-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres-data: