# =======================================================================
# Fitback Spring Boot Global Configuration
# =======================================================================
spring:
  application:
    name: fitback

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitback}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

ai:
  api-key: ${API_KEY_CODE:}
  base-url: ${AI_BASE_URL:}
  analyze-path: ${AI_ANALYZE_PATH:/ai/v1/consultations/analyze}
  message-generate-path: ${AI_MESSAGE_GENERATE_PATH:/messages/generate}
  fallback-enabled: ${AI_FALLBACK_ENABLED:false}
  max-attempts: ${AI_MAX_ATTEMPTS:2}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
